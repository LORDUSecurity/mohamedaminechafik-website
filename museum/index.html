<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery One — A Walk Through the Museum</title>
<meta name="description" content="A photorealistic 3D art museum. Scroll to walk the gallery and study the paintings.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #241f18;
    --stone: #d9d2c4;
    --warm: #8b7f6a;
    /* Bahnschrift ships with Windows, so the label never drops to a serif the
       way GameVerse's headings did when its webfont went missing */
    --display: "Chakra Petch", Bahnschrift, "Segoe UI Variable Display", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    background: #14120f;
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* scroll length drives the walk: one viewport per camera beat */
  #track { height: 2500vh; position: relative; z-index: 0; pointer-events: none; }
  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; z-index: 5; pointer-events: none; }

  /* entrance plate */
  #title {
    inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; z-index: 6; transition: opacity 1.1s ease;
    text-shadow: 0 2px 30px rgba(20,16,10,.55), 0 0 3px rgba(255,246,228,.7);
  }
  #title .k { font-size: 10px; letter-spacing: .52em; text-transform: uppercase; color: #f0e6d0; opacity: .8; }
  #title h1 {
    margin-top: 22px; font-weight: 400; color: #f7efdd;
    font-size: clamp(30px, 6.2vw, 76px); letter-spacing: .16em;
  }
  #title .rule { width: clamp(70px, 12vw, 150px); height: 1px; background: #e9dbbd; opacity: .55; margin: 26px 0; }
  #title .s { font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: #e3d7bd; opacity: .8; }
  #title .hint {
    margin-top: 64px; font-size: 10px; letter-spacing: .42em; text-transform: uppercase; color: #f2e7cd;
    opacity: .65; animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: .3; transform: translateY(0); } 50% { opacity: .85; transform: translateY(6px); } }

  /* The label is a title card, not a panel pinned to a corner: the camera
     pushes the canvas to one side of the frame and this takes the half it
     leaves, anchored to that edge and centred against the picture. */
  #cap {
    top: 0; bottom: 0; width: min(44vw, 560px);
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 clamp(20px, 3.2vw, 50px);
    text-shadow: 0 1px 16px rgba(12,10,7,.8), 0 2px 40px rgba(12,10,7,.5);
  }
  /* The wall behind the text is lit plaster, so the panel darkens it with a
     falloff from the edge of the frame rather than drawing a box around it.
     The scrim runs past the text and reaches nothing well inside its own box:
     a gradient that ends at the box edge shows a Mach band there. */
  #cap::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    opacity: 0; transition: opacity 700ms ease;
  }
  #cap.on::before { opacity: 1; }
  #cap.right { right: 0; align-items: flex-end; text-align: right; }
  #cap.right::before {
    left: -16vw;
    background: linear-gradient(to left, rgba(11,9,6,.74), rgba(11,9,6,.42) 30%,
      rgba(11,9,6,.13) 58%, rgba(11,9,6,0) 82%);
  }
  #cap.left { left: 0; align-items: flex-start; text-align: left; }
  #cap.left::before {
    right: -16vw;
    background: linear-gradient(to right, rgba(11,9,6,.74), rgba(11,9,6,.42) 30%,
      rgba(11,9,6,.13) 58%, rgba(11,9,6,0) 82%);
  }

  /* The exhibit plate: a card of black glass, bigger than the text it carries.
     No coloured frame — the accent survives in the kicker, the logo chip, the
     tear, and the neon tubes laid on the cut corners below.
     Two rules hold this together. The glass must sit on the element that
     carries the clip-path, because a `filter` (or `will-change: opacity`) on an
     ANCESTOR turns it into a backdrop root and the blur then samples nothing —
     that is why .plate is a bare layout wrapper and .sheet owns the glass. And
     the tubes must be a SIBLING of .sheet, not a descendant, or the plate's own
     clip-path would cut away the outer half of every glow.
     The painting's own credit is deliberately not in the card — it hangs under
     the plate on the plaster, in small plain type. */
  #cap .plate { position: relative; width: 100%; }
  #cap .sheet {
    background: rgba(0, 0, 0, .6);
    backdrop-filter: blur(26px) brightness(.5) saturate(.4);
    -webkit-backdrop-filter: blur(26px) brightness(.5) saturate(.4);
    padding: clamp(34px, 3.8vw, 52px) clamp(32px, 3.5vw, 48px) clamp(26px, 2.8vw, 38px);
    text-align: left;
  }
  /* One solid wedge per chamfer: a square clipped to the corner's right
     triangle, which is the piece the cut removed. The clip runs before the
     parent's filter, so the glow traces the triangle rather than the square. */
  #cap .neon {
    position: absolute; inset: 0; pointer-events: none;
    filter: drop-shadow(0 0 5px var(--accent, #cbb98f))
            drop-shadow(0 0 18px color-mix(in srgb, var(--accent, #cbb98f) 70%, transparent));
  }
  #cap .neon i { position: absolute; width: var(--cut, 30px); height: var(--cut, 30px);
    background: var(--accent, #cbb98f); }
  #cap .neon .c-tl { top: 0; left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); }
  #cap .neon .c-tr { top: 0; right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%); }
  #cap .neon .c-br { bottom: 0; right: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  #cap .neon .c-bl { bottom: 0; left: 0; clip-path: polygon(0 0, 0 100%, 100% 100%); }

  #cap .n { display: flex; align-items: center; gap: 11px;
    font-size: 10px; letter-spacing: .32em; text-transform: uppercase;
    color: color-mix(in srgb, var(--accent, #d7c6a0) 72%, white 28%);
    margin-bottom: 20px; }
  #cap .n::before { content: ''; width: 5px; height: 5px; flex: none;
    background: var(--accent, #cbb98f); transform: rotate(45deg);
    box-shadow: 0 0 10px var(--accent, #cbb98f); }

  /* Every mark sits inside the same square chip — a neon-bordered tile in the
     work's colour, its chamfer matching the plate's — with the app's own logo
     centred in it. The glow is the accent; the square is universal. */
  #cap .titlerow { display: flex; align-items: center; gap: 15px; }
  #cap .logo {
    flex: none; width: 44px; height: 44px; padding: 6px;
    background: linear-gradient(160deg, rgba(14,13,12,.94), rgba(3,3,3,.97));
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent, #cbb98f) 85%, transparent);
    filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent, #cbb98f) 55%, transparent))
            drop-shadow(0 0 22px color-mix(in srgb, var(--accent, #cbb98f) 28%, transparent)); }
  #cap .logo img { width: 100%; height: 100%; display: block; }
  /* a mark that is itself a tile fills the chip and takes its chamfer */
  #cap .logo.flat { padding: 0; }
  #cap h1 { position: relative; z-index: 1;
    font-family: var(--display); font-weight: 500;
    font-size: clamp(19px, 2.05vw, 27px);
    line-height: 1.14; letter-spacing: .045em; color: #f4ecdb; }
  #cap p { margin-top: 18px; max-width: 44ch; font-size: 14px; line-height: 1.72; color: #cfc5b1; }
  #cap .t { margin-top: 16px; padding: 0 4px;
    font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: #988c74; }

  /* Each line arrives on its own beat, eased out, and the block leaves together
     and faster than it came — the card is a title, not a control. */
  #cap .sheet, #cap .neon, #cap .sheet > * {
    opacity: 0; transform: translateY(12px); will-change: transform, opacity;
    transition: opacity 260ms ease, transform 260ms ease;
  }
  #cap.on .sheet, #cap.on .neon, #cap.on .sheet > * {
    opacity: 1; transform: none;
    transition: opacity 560ms cubic-bezier(.16, 1, .3, 1), transform 560ms cubic-bezier(.16, 1, .3, 1);
  }
  #cap.on .sheet     { transition-delay: 0ms; }
  #cap.on .neon      { transition-delay: 0ms; }
  #cap.on .n         { transition-delay: 120ms; }
  #cap.on .titlerow  { transition-delay: 210ms; }
  #cap.on p          { transition-delay: 300ms; }
  #cap .t { opacity: 0; transition: opacity 420ms ease 380ms; }
  #cap.on .t { opacity: 1; }
  /* reduced motion keeps the fade — the text still has to arrive in order —
     and drops the travel */
  @media (prefers-reduced-motion: reduce) {
    #cap .sheet, #cap .neon, #cap .sheet > *,
    #cap.on .sheet, #cap.on .neon, #cap.on .sheet > * { transform: none; transition: opacity 300ms ease; transition-delay: 0ms; }
  }

  /* progress */
  #prog {
    right: clamp(18px, 3.2vw, 44px); bottom: clamp(24px, 4vh, 48px); text-align: right;
    font-size: 9.5px; letter-spacing: .32em; text-transform: uppercase; color: #f0e5cf;
    text-shadow: 0 1px 12px rgba(0,0,0,.6);
  }
  #bar { width: 148px; height: 1px; background: rgba(240,229,207,.28); margin: 10px 0 0 auto; }
  #bar i { display: block; height: 100%; width: 0; background: #f4ead4; }

  /* end plate */
  #end {
    inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; z-index: 6; opacity: 0; transition: opacity 1.2s ease;
  }
  #end h2 { font-size: clamp(20px, 3.2vw, 38px); font-weight: 400; letter-spacing: .14em; color: #f6eedb;
    text-shadow: 0 2px 26px rgba(15,12,8,.6); }
  #end p { margin-top: 14px; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #ddceb0; opacity: .8; }
  #end .again { margin-top: 40px; font-size: 9.5px; letter-spacing: .4em; text-transform: uppercase; color: #cbb98f; opacity: .7; }
  /* the close lands on a bright expanse of floor, so the plate carries its own
     scrim rather than relying on the vignette at the frame edges */
  #end::before { content: ''; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(62% 40% at 50% 46%, rgba(10,8,5,.52), rgba(10,8,5,0) 74%); }

  /* the coda bleaches the plaster to a plain white field, so the plate turns
     over with it: the same words in ink, carried on a wash of paper rather
     than a scrim of dark */
  #end h2, #end p, #end .again { transition: color .8s ease, text-shadow .8s ease; }
  body.bleached #end h2 { color: #241e16; text-shadow: 0 1px 20px rgba(255,253,247,.8); }
  body.bleached #end p { color: #4d4438; opacity: .85; }
  body.bleached #end .again { color: #6f6455; opacity: .8; }
  body.bleached #end::before {
    background: radial-gradient(62% 40% at 50% 46%, rgba(253,250,244,.62), rgba(253,250,244,0) 74%); }
  /* the readout is set in the same plate's ink, so it turns with it */
  body.bleached #prog { color: #3a3227; text-shadow: none; }
  body.bleached #bar { background: rgba(58,50,39,.22); }
  body.bleached #bar i { background: #3a3227; }

  #veil { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 90% at 50% 45%, rgba(12,10,7,0) 40%, rgba(12,10,7,.55) 100%),
                linear-gradient(to bottom, rgba(14,11,8,.35), rgba(14,11,8,0) 30%, rgba(14,11,8,0) 70%, rgba(14,11,8,.45)); }

  /* loader */
  #load {
    position: fixed; inset: 0; z-index: 9; background: #14120f;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    transition: opacity .9s ease;
  }
  #load.gone { opacity: 0; pointer-events: none; }
  #load .l { font-size: 10px; letter-spacing: .42em; text-transform: uppercase; color: #cbb98f; }
  #load .bar { width: 200px; height: 1px; background: rgba(203,185,143,.25); overflow: hidden; }
  #load .bar i { display: block; width: 40%; height: 100%; background: #cbb98f; animation: sweep 1.5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-105%); } 100% { transform: translateX(260%); } }
  #fatal {
    display: none; position: fixed; z-index: 10; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 520px; padding: 26px 30px; background: #1c1812; color: #e8dcc0; border: 1px solid #443a28;
    font-size: 13px; line-height: 1.7; letter-spacing: .02em;
  }
  @media (max-width: 760px) {
    /* On a tall screen there is no usable column beside a canvas, so the card
       falls below the picture and reads along the bottom edge instead. */
    #cap, #cap.left, #cap.right {
      top: auto; bottom: 0; left: 0; right: 0; width: auto;
      align-items: flex-start; text-align: left; justify-content: flex-end;
      padding: 0 26px min(7vh, 54px);
    }
    #cap.left::before, #cap.right::before {
      inset: auto -16vw 0; height: 62vh;
      background: linear-gradient(to top, rgba(11,9,6,.78), rgba(11,9,6,.46) 32%,
        rgba(11,9,6,.14) 56%, rgba(11,9,6,0) 78%);
    }
    #cap p { max-width: 46ch; font-size: 13px; }
    #cap .t { display: none; }
    #prog { display: none; }
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="track" aria-hidden="true"></div>

  <div id="title" class="hud">
    <div class="k">Museum of Painting</div>
    <h1>GALLERY ONE</h1>
    <div class="rule"></div>
    <div class="s">From the Renaissance to the Moderns</div>
    <div class="hint">Scroll to enter &darr;</div>
  </div>

  <div id="cap" class="hud right">
    <div class="plate"><div class="sheet">
      <div class="n"></div>
      <div class="titlerow"><div class="logo"><img alt=""></div><h1></h1></div>
      <p></p>
    </div><i class="neon"></i></div>
    <div class="t"></div>
  </div>

  <div id="prog" class="hud">0% walked<div id="bar"><i></i></div></div>
  <div id="end" class="hud">
    <h2>End of Gallery One</h2>
    <p>Look up, or scroll up to walk back out</p>
    <div class="again">You have walked the full length of the room</div>
  </div>
  <div id="veil"></div>

  <div id="load">
    <div class="l">Opening the gallery</div>
    <div class="bar"><i></i></div>
    <div class="l" id="loadText" style="opacity:.6">Preparing</div>
  </div>
  <div id="fatal"></div>

  <script src="lib/three.min.js"></script>
  <script src="lib/three-globals.js"></script>
  <script src="lib/shims.js"></script>
  <script src="lib/CopyShader.js"></script>
  <script src="lib/LuminosityHighPassShader.js"></script>
  <script src="lib/Pass.js"></script>
  <script src="lib/EffectComposer.js"></script>
  <script src="lib/RenderPass.js"></script>
  <script src="lib/ShaderPass.js"></script>
  <script src="lib/UnrealBloomPass.js"></script>
  <script src="lib/OutputPass.js"></script>
  <script src="lib/FXAAShader.js"></script>
  <script src="lib/addon-globals.js"></script>
  <script src="lib/gsap.min.js"></script>
  <script src="lib/ScrollTrigger.min.js"></script>
  <script src="js/art.js"></script>
  <script src="js/museum.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/glitch.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
