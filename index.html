<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery One — A Walk Through the Museum</title>
<meta name="description" content="A photorealistic 3D art museum. Scroll to walk the gallery and study the paintings.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* ------------------------------------------------------------ tokens ----
     The portfolio's palette, moved whole: cool near-black surfaces, one hairline
     step up per layer, ink/dim/dimmer greys for type, and a single accent that
     the walk hands over to whichever work is on screen (?skin= picks a variant,
     see below — hud keeps the room lit warm, grade cools it, veil frames it). */
  :root {
    --bg: #06070a;
    --panel: #0b0d12;
    --panel-2: #0e1117;
    --line: #1c212a;
    --line-2: #262c37;
    --ink: #ece9e2;
    --dim: #8d939d;
    --dimmer: #737a85;
    --accent: #ffd23f;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --display: "Chakra Petch", Bahnschrift, "Segoe UI Variable Display", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: auto; }
  /* the dossier holds the walk still while it is open — the wheel belongs to the
     page of text, not to the camera */
  html.locked { overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--display);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* scroll length drives the walk: one viewport per camera beat. 9 screens of
     wheel for the whole room — enough dwell to read a plate at each stop, short
     enough that nobody walks out of patience before the coda. */
  #track { height: 1000vh; position: relative; z-index: 0; pointer-events: none; }
  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; z-index: 5; pointer-events: none; }

  /* entrance plate */
  #title {
    inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; z-index: 6; transition: opacity 1.1s ease;
    text-shadow: 0 2px 30px rgba(6,7,10,.72);
  }
  #title .k { font-family: var(--mono); font-size: 10px; letter-spacing: .42em;
    text-transform: uppercase; color: var(--dim); }
  #title h1 {
    margin-top: 22px; font-weight: 600; color: var(--ink); text-transform: uppercase;
    font-size: clamp(30px, 6.2vw, 76px); line-height: .98; letter-spacing: .06em;
  }
  /* the portfolio's eyebrow rule: a lit hairline, not a neutral divider */
  #title .rule { width: clamp(70px, 12vw, 150px); height: 1px; margin: 26px 0;
    background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  #title .s { font-family: var(--mono); font-size: 10.5px; letter-spacing: .28em;
    text-transform: uppercase; color: var(--dim); }
  #title .hint {
    margin-top: 64px; font-family: var(--mono); font-size: 10px; letter-spacing: .34em;
    text-transform: uppercase; color: var(--accent); opacity: .7;
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: .28; transform: translateY(0); } 50% { opacity: .8; transform: translateY(6px); } }

  /* The label is a title card, not a panel pinned to a corner: the camera
     pushes the canvas to one side of the frame and this takes the half it
     leaves, anchored to that edge and centred against the picture. */
  #cap {
    top: 0; bottom: 0; width: min(44vw, 560px);
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 clamp(20px, 3.2vw, 50px);
  }
  /* The wall behind the text darkens with a falloff from the edge of the frame
     rather than drawing a box around it. The scrim runs past the text and
     reaches nothing well inside its own box: a gradient that ends at the box
     edge shows a Mach band there. */
  #cap::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    opacity: 0; transition: opacity 700ms ease;
  }
  #cap.on::before { opacity: 1; }
  #cap.right { right: 0; align-items: flex-end; text-align: right; }
  #cap.right::before {
    left: -16vw;
    background: linear-gradient(to left, rgba(6,7,10,.8), rgba(6,7,10,.46) 30%,
      rgba(6,7,10,.15) 58%, rgba(6,7,10,0) 82%);
  }
  #cap.left { left: 0; align-items: flex-start; text-align: left; }
  #cap.left::before {
    right: -16vw;
    background: linear-gradient(to right, rgba(6,7,10,.8), rgba(6,7,10,.46) 30%,
      rgba(6,7,10,.15) 58%, rgba(6,7,10,0) 82%);
  }

  /* The exhibit plate, carried on the portfolio's own frame idiom: an
     accent-tinted edge one pixel wide, with the glass inset behind it, the whole
     silhouette chamfered on the corners the work cuts. Two rules hold this
     together. The glass must sit on the element that carries the blur, and the
     neon wedges must be a SIBLING of the framed plate — clip-path on the plate
     shaves the outer half of a glow it contains, and a filter on an ancestor of
     .sheet turns that ancestor into a backdrop root so the blur samples nothing.
     The holder is the bare layout box both of them measure themselves against.
     The painting's own credit is deliberately not in the card — it hangs under
     the plate on the plaster, in small mono type. */
  #cap .holder { position: relative; width: 100%; }
  #cap .plate { background: var(--edge, color-mix(in srgb, var(--accent) 46%, var(--line-2)));
    padding: 1px; }
  #cap .sheet {
    background: color-mix(in srgb, var(--panel) 74%, transparent);
    backdrop-filter: blur(26px) brightness(.86) saturate(.82);
    -webkit-backdrop-filter: blur(26px) brightness(.86) saturate(.82);
    padding: clamp(34px, 3.8vw, 52px) clamp(32px, 3.5vw, 48px) clamp(26px, 2.8vw, 38px);
    text-align: left;
  }
  /* One solid wedge per chamfer: a square clipped to the corner's right
     triangle, which is the piece the cut removed. The clip runs before the
     parent's filter, so the glow traces the triangle rather than the square. */
  #cap .neon {
    position: absolute; inset: 0; pointer-events: none;
    filter: drop-shadow(0 0 5px var(--accent))
            drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 70%, transparent));
  }
  #cap .neon i { position: absolute; width: var(--cut, 30px); height: var(--cut, 30px);
    background: var(--accent); }
  #cap .neon .c-tl { top: 0; left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); }
  #cap .neon .c-tr { top: 0; right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%); }
  #cap .neon .c-br { bottom: 0; right: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  #cap .neon .c-bl { bottom: 0; left: 0; clip-path: polygon(0 0, 0 100%, 100% 100%); }

  #cap .n { display: flex; align-items: center; gap: 11px;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .28em; text-transform: uppercase;
    color: color-mix(in srgb, var(--accent) 78%, white 22%);
    margin-bottom: 20px; }
  #cap .n::before { content: ''; width: 5px; height: 5px; flex: none;
    background: var(--accent); transform: rotate(45deg);
    box-shadow: 0 0 10px var(--accent); }

  /* Every mark sits inside the same square chip — a neon-bordered tile in the
     work's colour, its chamfer matching the plate's — with the app's own logo
     centred in it. The glow is the accent; the square is universal. */
  #cap .titlerow { display: flex; align-items: center; gap: 15px; }
  #cap .logo {
    flex: none; width: 44px; height: 44px; padding: 6px;
    background: linear-gradient(160deg, var(--panel-2), var(--bg));
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 85%, transparent);
    filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 55%, transparent))
            drop-shadow(0 0 22px color-mix(in srgb, var(--accent) 28%, transparent)); }
  #cap .logo img { width: 100%; height: 100%; display: block; }
  /* a mark that is itself a tile fills the chip and takes its chamfer */
  #cap .logo.flat { padding: 0; }
  #cap h1 { position: relative; z-index: 1;
    font-family: var(--display); font-weight: 600;
    font-size: clamp(19px, 2.05vw, 27px);
    line-height: 1.14; letter-spacing: .03em; color: var(--ink); }
  #cap p { margin-top: 18px; max-width: 44ch; font-family: var(--display);
    font-size: 14px; line-height: 1.72; color: var(--dim); }
  #cap .t { padding-left: 10px;
    border-left: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    font-family: var(--mono); font-size: 9px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--dimmer); }
  /* the rule rides the edge the plate is anchored to, so on the right-hand
     hangs it does not float out in the open frame */
  #cap.right .t { padding-left: 0; padding-right: 10px;
    border-left: 0; border-right: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }

  /* Each line arrives on its own beat, eased out, and the block leaves together
     and faster than it came — the card is a title, not a control. */
  #cap .plate, #cap .neon, #cap .plate > *, #cap .sheet > * {
    opacity: 0; transform: translateY(12px);
    transition: opacity 260ms ease, transform 260ms ease;
  }
  #cap.on .plate, #cap.on .neon, #cap.on .plate > *, #cap.on .sheet > * {
    opacity: 1; transform: none;
    transition: opacity 560ms cubic-bezier(.16, 1, .3, 1), transform 560ms cubic-bezier(.16, 1, .3, 1);
  }
  #cap.on .plate     { transition-delay: 0ms; }
  #cap.on .neon      { transition-delay: 0ms; }
  #cap.on .n         { transition-delay: 120ms; }
  #cap.on .titlerow  { transition-delay: 210ms; }
  #cap.on p          { transition-delay: 300ms; }
  /* The controls under the card belong to the stop, not to the room: they arrive
     with the plate and are inert while it is away, or a visitor would be clicking
     a download button floating over bare plaster between two pictures. */
  #cap .under { opacity: 0; transition: opacity 420ms ease 380ms; }
  #cap.on .under { opacity: 1; }
  #cap .tools { pointer-events: none; }
  #cap.on .tools { pointer-events: auto; }
  #cap .t { opacity: 0; transition: opacity 420ms ease 380ms; }
  #cap.on .t { opacity: 1; }
  /* reduced motion keeps the fade — the text still has to arrive in order —
     and drops the travel */
  @media (prefers-reduced-motion: reduce) {
    #cap .plate, #cap .neon, #cap .plate > *, #cap .sheet > *,
    #cap.on .plate, #cap.on .neon, #cap.on .plate > *, #cap.on .sheet > * {
      transform: none; transition: opacity 300ms ease; transition-delay: 0ms; }
  }

  /* progress */
  #prog {
    right: clamp(18px, 3.2vw, 44px); bottom: clamp(24px, 4vh, 48px); text-align: right;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .28em;
    text-transform: uppercase; color: var(--dim);
    text-shadow: 0 1px 12px rgba(6,7,10,.8);
  }
  #bar { width: 148px; height: 1px; background: var(--line-2); margin: 10px 0 0 auto; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent);
    box-shadow: 0 0 8px var(--accent); }

  /* end plate */
  #end {
    inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; z-index: 6; opacity: 0; transition: opacity 1.2s ease;
  }
  #end h2 { font-size: clamp(20px, 3.2vw, 38px); font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--ink); text-shadow: 0 2px 26px rgba(6,7,10,.72); }
  #end p { margin-top: 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .26em;
    text-transform: uppercase; color: var(--dim); }
  #end .again { margin-top: 40px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .34em;
    text-transform: uppercase; color: var(--accent); opacity: .7; }
  /* the close lands on a bright expanse of floor, so the plate carries its own
     scrim rather than relying on the vignette at the frame edges */
  #end::before { content: ''; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(62% 40% at 50% 46%, rgba(6,7,10,.6), rgba(6,7,10,0) 74%); }

  /* the coda bleaches the plaster to a plain white field, so the plate turns
     over with it: the same words in ink, carried on a wash of paper rather
     than a scrim of dark */
  #end h2, #end p, #end .again, #prog, #bar { transition: color .8s ease, text-shadow .8s ease, background .8s ease; }
  body.bleached #end h2 { color: #1d222b; text-shadow: 0 1px 20px rgba(255,253,247,.8); }
  body.bleached #end p { color: #454d59; }
  body.bleached #end .again { color: #2f3641; opacity: .8; }
  body.bleached #end::before {
    background: radial-gradient(62% 40% at 50% 46%, rgba(253,250,244,.62), rgba(253,250,244,0) 74%); }
  /* the readout is set in the same plate's ink, so it turns with it */
  body.bleached #prog { color: #343b45; text-shadow: none; }
  body.bleached #bar { background: rgba(52,59,69,.24); }
  body.bleached #bar i { background: #343b45; box-shadow: none; }

  #veil { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 90% at 50% 45%, rgba(6,7,10,0) 40%, rgba(6,7,10,.6) 100%),
                linear-gradient(to bottom, rgba(6,7,10,.4), rgba(6,7,10,0) 30%, rgba(6,7,10,0) 70%, rgba(6,7,10,.5)); }

  /* ?skin=veil — the portfolio's own background stack laid over the frame: a dot
     grid, a glow burning at the top edge in the work's accent, and scanlines.
     Masked to the outside of the ellipse so the texture is a frame and never a
     veil across the painting itself. Only mounted under that skin. */
  #bgfx { position: fixed; inset: 0; z-index: 4; pointer-events: none; display: none; }
  body.skin-veil #bgfx { display: block; }
  #bgfx i { position: absolute; inset: 0; display: block; }
  #bgfx .g-grid {
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.075) 1px, transparent 1.4px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 62% 54% at 50% 46%, transparent 55%, #000 100%);
    -webkit-mask-image: radial-gradient(ellipse 62% 54% at 50% 46%, transparent 55%, #000 100%);
  }
  #bgfx .g-glow {
    background: radial-gradient(closest-side at 50% 0%,
      color-mix(in srgb, var(--accent) 16%, transparent), transparent 72%);
    filter: blur(20px);
    mask-image: linear-gradient(to bottom, #000, transparent 46%);
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent 46%);
  }
  #bgfx .g-scan {
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.016) 0 1px, transparent 1px 3px);
    mask-image: radial-gradient(ellipse 70% 62% at 50% 46%, transparent 48%, #000 100%);
    -webkit-mask-image: radial-gradient(ellipse 70% 62% at 50% 46%, transparent 48%, #000 100%);
  }

  /* loader */
  #load {
    position: fixed; inset: 0; z-index: 9; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    transition: opacity .9s ease;
  }
  #load.gone { opacity: 0; pointer-events: none; }
  #load .l { font-family: var(--mono); font-size: 10px; letter-spacing: .34em;
    text-transform: uppercase; color: var(--dim); }
  #load .bar { width: 200px; height: 1px; background: var(--line); overflow: hidden; }
  #load .bar i { display: block; width: 40%; height: 100%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent); animation: sweep 1.5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-105%); } 100% { transform: translateX(260%); } }
  #fatal {
    display: none; position: fixed; z-index: 10; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 520px; padding: 26px 30px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line-2);
    font-family: var(--mono); font-size: 12px; line-height: 1.7; letter-spacing: .02em;
  }
  /* ========================================================== buttons ====
     The portfolio's button idiom, moved whole: a one-pixel accent frame around a
     panel face, four corners chamfered, and on hover the frame's colour floods
     the plate while the mark knocks out dark inside a glow. No staged ignition
     and no waiting — the flood is the whole animation.
     The clip is written out rather than built from --cut, because --cut is the
     plate's wedge size and a button must not inherit it. */
  .btn{--edge:var(--line-2);display:inline-flex;background:var(--edge);padding:1px;
    clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));
    pointer-events:auto;cursor:pointer;text-decoration:none;
    transition:background .2s ease,filter .25s ease,transform .15s ease}
  .btn>.face{display:inline-flex;align-items:center;gap:9px;background:var(--panel);padding:10px 15px;
    clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));
    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink);white-space:nowrap;transition:background .2s ease,color .2s ease}
  .btn:hover{--edge:var(--accent);filter:drop-shadow(0 0 14px color-mix(in srgb, var(--edge) 45%, transparent))}
  .btn:hover>.face{background:var(--accent);color:#06070a}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:15px;height:15px;flex:none;fill:currentColor}
  .btn svg:not([fill]){fill:none;stroke:currentColor;stroke-width:1.6}
  .btn .arr{font-size:12px;line-height:1}
  .btn-ico>.face{padding:10px 12px}
  .btn-ico svg{width:17px;height:17px}
  .btn-ico img{width:17px;height:17px;object-fit:contain}
  .btn-ghost>.face{background:transparent;color:var(--dim)}
  .btn-ghost:hover>.face{color:#06070a}

  /* the framed output label: what the work actually is, in the work's colour */
  .out{display:inline-flex;align-items:center;padding:4px 9px;
    border:1px solid color-mix(in srgb, var(--accent) 80%, transparent);
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:color-mix(in srgb, var(--accent) 82%, white 18%);
    box-shadow:0 0 12px color-mix(in srgb, var(--accent) 22%, transparent)}

  /* the door, top right: leave the gallery for the portfolio */
  #door{top:clamp(12px,2.4vh,22px);right:clamp(14px,3vw,34px);z-index:7;opacity:0;
    transition:opacity .7s ease}
  #door.on{opacity:1}

  /* the row of controls under the plate */
  #cap .under{width:100%;display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-top:2px}
  #cap.right .under{align-items:flex-end}
  #cap .tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  #cap .tools .btn{--edge:color-mix(in srgb, var(--accent) 40%, var(--line-2))}
  #cap .tools .btn[disabled]{opacity:.34;pointer-events:none}

  /* the colour menu the download button opens */
  #cap .dl{position:relative}
  #hue{position:absolute;bottom:calc(100% + 9px);right:0;display:none;
    grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px;width:236px;
    background:var(--panel);border:1px solid var(--line-2);pointer-events:auto;
    box-shadow:0 18px 44px rgba(0,0,0,.55)}
  #hue.on{display:grid}
  #hue .lab{grid-column:1/-1;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dimmer)}
  #hue button{display:flex;align-items:center;gap:9px;padding:6px 8px;cursor:pointer;
    background:var(--panel-2);border:1px solid var(--line);
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    transition:border-color .18s ease,color .18s ease}
  #hue button:hover,#hue button:focus-visible{border-color:var(--hc);color:var(--ink);outline:none}
  #hue i{width:11px;height:11px;flex:none;background:var(--hc);
    box-shadow:0 0 9px color-mix(in srgb, var(--hc) 70%, transparent)}

  /* ======================================================== detail card ==== */
  #detail{inset:0;z-index:8;display:none;align-items:center;justify-content:center;
    padding:clamp(14px,3vw,40px)}
  #detail.on{display:flex}
  #detail .dscrim{position:absolute;inset:0;background:rgba(6,7,10,.72);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);pointer-events:auto}
  #detail .dplate{position:relative;width:min(1040px,100%);pointer-events:auto;
    background:color-mix(in srgb, var(--accent) 42%, var(--line-2));padding:1px;
    clip-path:polygon(0 22px,22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px));
    box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 46px color-mix(in srgb, var(--accent) 12%, transparent)}
  #detail .dsheet{background:color-mix(in srgb, var(--panel) 94%, transparent);
    clip-path:polygon(0 22px,22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px));
    max-height:min(84vh,860px);overflow-y:auto;overscroll-behavior:contain;
    padding:clamp(22px,3vw,40px) clamp(20px,3.2vw,44px) clamp(24px,3vw,36px)}
  #detail .dhead{display:flex;align-items:center;gap:16px;padding-right:56px}
  #detail .dlogo{flex:none;width:46px;height:46px;padding:6px;
    background:linear-gradient(160deg, var(--panel-2), var(--bg));
    box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 85%, transparent);
    filter:drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 45%, transparent))}
  #detail .dlogo img{width:100%;height:100%;display:block}
  #detail .dkick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dimmer)}
  #detail h2{font-size:clamp(21px,2.6vw,32px);font-weight:600;letter-spacing:.02em;color:var(--ink)}
  /* pinned to the plate, not to the scrolling sheet: the dossier is long and the
     way out has to stay where the hand left it */
  #detail .dclose{position:absolute;top:16px;right:16px;z-index:2}
  #detail .dlede{margin-top:20px;max-width:78ch;font-size:15px;line-height:1.72;color:var(--dim)}
  #detail .dlede b{color:var(--ink);font-weight:500}
  #detail .dstats{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
  #detail .stat{padding:9px 13px;background:var(--panel-2);border-left:2px solid var(--accent)}
  #detail .stat b{display:block;font-size:19px;font-weight:600;letter-spacing:.01em;color:var(--ink)}
  #detail .stat span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer)}
  #detail h3{margin:30px 0 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.28em;
    text-transform:uppercase;color:color-mix(in srgb, var(--accent) 78%, white 22%)}
  /* the media bay: one stage, a strip of thumbs under it, video in the same slot */
  #detail .stage{position:relative;background:var(--bg);border:1px solid var(--line);overflow:hidden}
  #detail .stage img,#detail .stage video{display:block;width:100%;max-height:46vh;object-fit:contain;background:#08090c}
  #detail .thumbs{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  #detail .thumbs button{width:74px;height:44px;flex:none;padding:0;cursor:pointer;
    background:#08090c;border:1px solid var(--line);pointer-events:auto;overflow:hidden;
    transition:border-color .18s ease}
  #detail .thumbs button img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  #detail .thumbs button.on,#detail .thumbs button:hover{border-color:var(--accent)}
  #detail .thumbs button.vid{display:grid;place-items:center;font-family:var(--mono);font-size:14px;color:var(--accent)}
  #detail dl.tech{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:2px 22px}
  #detail dl.tech dt{padding:9px 0 8px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
  #detail dl.tech dd{padding:9px 0 8px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.62;color:var(--dim)}
  #detail .dacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
  @media (max-width:860px){
    #detail dl.tech{grid-template-columns:minmax(0,1fr)}
    #detail dl.tech dd{padding-top:0;border-top:0}
    #detail .dsheet{max-height:88vh}
  }

  /* contact rows on the welcome and the farewell. They are inert while their
     plate is faded out, or a hidden button would still eat the click */
  #title .cta,#end .cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    margin-top:34px;pointer-events:none}
  #title.live .cta,#end.live .cta{pointer-events:auto}
  #end .cta{margin-top:30px}

  @media (max-width: 760px) {
    /* On a tall screen there is no usable column beside a canvas, so the card
       falls below the picture and reads along the bottom edge instead. */
    #cap, #cap.left, #cap.right {
      top: auto; bottom: 0; left: 0; right: 0; width: auto;
      align-items: flex-start; text-align: left; justify-content: flex-end;
      padding: 0 18px calc(min(7vh, 54px) + env(safe-area-inset-bottom));
    }
    #cap.left::before, #cap.right::before {
      inset: auto -16vw 0; height: 62vh;
      background: linear-gradient(to top, rgba(6,7,10,.84), rgba(6,7,10,.5) 32%,
        rgba(6,7,10,.16) 56%, rgba(6,7,10,0) 78%);
    }
    #cap .sheet { padding: clamp(22px, 5.6vw, 30px) clamp(20px, 5.2vw, 26px) clamp(18px, 4.6vw, 24px); }
    #cap p { max-width: 46ch; font-size: 13px; }
    #cap .t { display: none; }
    #cap .under { align-items: stretch; }
    #cap .tools { justify-content: flex-start; flex-wrap: wrap; }
    #prog { display: none; }
    /* the door moves clear of the notch, and the welcome stack tightens */
    #door { top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }
    #title { padding: 0 18px; }
    #title .hint { margin-top: 30px; }
    #title .cta, #end .cta { margin-top: 24px; gap: 8px; }
    #title .cta .btn > .face, #end .cta .btn > .face { padding: 9px 12px; font-size: 9.5px; }
    /* the dossier becomes a sheet that fills the phone, not a window floating on
       a wall — it is meant to be read, so it takes the whole page */
    #detail { padding: 0; align-items: flex-end; }
    #detail .dplate { width: 100%; max-height: 92vh; }
    #detail .dsheet { max-height: 92vh; padding: 22px 18px calc(24px + env(safe-area-inset-bottom)); }
    #detail .dhead { padding-right: 46px; gap: 12px; }
    #detail .dlogo { width: 38px; height: 38px; }
    #detail h2 { font-size: 22px; }
    #detail .dlede { font-size: 14px; }
    #detail .stat { padding: 8px 11px; }
    #detail .stat b { font-size: 17px; }
    #detail .thumbs button { width: 58px; height: 36px; }
    #detail .stage img, #detail .stage video { max-height: 34vh; }
    #detail .dclose { top: 12px; right: 12px; }
    #hue { width: min(280px, 78vw); }
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="track" aria-hidden="true"></div>

  <div id="title" class="hud">
    <div class="k">Welcome · Museum of Painting</div>
    <h1>Gallery One</h1>
    <div class="rule"></div>
    <div class="s">From the Renaissance to the Moderns</div>
    <div class="cta" id="ctaTop"></div>
    <div class="hint">Scroll to enter &darr;</div>
  </div>

  <div id="cap" class="hud right">
    <div class="holder"><div class="plate"><div class="sheet">
      <div class="n"><span class="out"></span></div>
      <div class="titlerow"><div class="logo"><img alt=""></div><h1></h1></div>
      <p></p>
    </div></div><i class="neon"></i></div>
    <div class="under">
      <div class="tools">
        <button type="button" class="btn" id="moreBtn"><span class="face">Show details <span class="arr">↗</span></span></button>
        <span class="dl">
          <button type="button" class="btn btn-ico" id="hueBtn" aria-haspopup="true" aria-expanded="false"
                  aria-label="Download a copy of this artwork" title="Download a copy of this artwork">
            <span class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3.5v11M7.5 10.5L12 15l4.5-4.5M4.5 19.5h15"/></svg></span>
          </button>
          <div id="hue" role="menu" aria-label="Choose a corruption colour"></div>
        </span>
      </div>
      <div class="t"></div>
    </div>
  </div>

  <div id="door" class="hud"></div>

  <div id="detail" class="hud" role="dialog" aria-modal="true" aria-labelledby="dName">
    <div class="dscrim" data-close></div>
    <div class="dplate"><div class="dsheet">
      <div class="dhead">
        <div class="dlogo"><img alt=""></div>
        <div>
          <div class="dkick"><span class="out"></span><span id="dMeta"></span></div>
          <h2 id="dName"></h2>
        </div>
      </div>
      <p class="dlede"></p>
      <div class="dstats"></div>
      <h3>Screens &amp; footage</h3>
      <div class="dmedia"></div>
      <h3>How it is built</h3>
      <dl class="tech"></dl>
      <div class="dacts"></div>
    </div><button type="button" class="btn btn-ico dclose" id="dClose" aria-label="Close"><span class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button></div>
  </div>

  <div id="prog" class="hud">0% walked<div id="bar"><i></i></div></div>
  <div id="end" class="hud">
    <h2>Goodbye from Gallery One</h2>
    <p>Look up, or scroll up to walk back out</p>
    <div class="again">Thank you for walking the room — the door is behind you</div>
    <div class="cta" id="ctaEnd"></div>
  </div>
  <div id="bgfx" aria-hidden="true"><i class="g-grid"></i><i class="g-glow"></i><i class="g-scan"></i></div>
  <div id="veil"></div>

  <div id="load">
    <div class="l">Opening the gallery</div>
    <div class="bar"><i></i></div>
    <div class="l" id="loadText" style="opacity:.6">Preparing</div>
  </div>
  <div id="fatal"></div>

  <script src="lib/three.min.js"></script>
  <script src="lib/three-globals.js"></script>
  <script src="lib/shims.js"></script>
  <script src="lib/CopyShader.js"></script>
  <script src="lib/LuminosityHighPassShader.js"></script>
  <script src="lib/Pass.js"></script>
  <script src="lib/EffectComposer.js"></script>
  <script src="lib/RenderPass.js"></script>
  <script src="lib/ShaderPass.js"></script>
  <script src="lib/UnrealBloomPass.js"></script>
  <script src="lib/OutputPass.js"></script>
  <script src="lib/FXAAShader.js"></script>
  <script src="lib/addon-globals.js"></script>
  <script src="lib/gsap.min.js"></script>
  <script src="lib/ScrollTrigger.min.js"></script>
  <script src="site/assets/js/icons.js"></script>
  <script src="js/skin.js"></script>
  <script src="js/works.js"></script>
  <script src="js/art.js"></script>
  <script src="js/museum.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/glitch.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
